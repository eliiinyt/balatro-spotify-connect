name: Build Daemon & Package Mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build Daemon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: daemon-x86_64-windows.exe
            src_path: daemon/target/release/balatro-spotify-daemon.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: daemon-x86_64-linux
            src_path: daemon/target/release/balatro-spotify-daemon
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: daemon-x86_64-apple-darwin
            src_path: daemon/target/release/balatro-spotify-daemon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libasound2-dev libpulse-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "daemon -> daemon/target"

      - name: Build release binary
        run: cargo build --release --manifest-path daemon/Cargo.toml

      - name: Rename and prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.src_path }}" "dist/${{ matrix.bin_name }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: dist/${{ matrix.bin_name }}
          retention-days: 14

  package-mod:
    name: Package Complete Mod (All Platforms)
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-x86_64-windows.exe
          path: bin/

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-x86_64-linux
          path: bin/

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-x86_64-apple-darwin
          path: bin/

      - name: Set executable permissions
        run: |
          chmod +x bin/daemon-x86_64-linux || true
          chmod +x bin/daemon-x86_64-apple-darwin || true

      - name: Create Complete Mod Zip
        run: |
          mkdir -p staging/balatro-spotify-connect
          cp -r balatro-spotify-connect.json README.md lovely src bin staging/balatro-spotify-connect/
          cd staging
          zip -r ../balatro-spotify-connect-complete.zip balatro-spotify-connect
          cd ..

      - name: Upload Ready-to-Play Mod Zip
        uses: actions/upload-artifact@v4
        with:
          name: balatro-spotify-connect-complete
          path: balatro-spotify-connect-complete.zip
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            balatro-spotify-connect-complete.zip
            bin/daemon-x86_64-windows.exe
            bin/daemon-x86_64-linux
            bin/daemon-x86_64-apple-darwin
          draft: false
          prerelease: false
          generate_release_notes: true
